<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{{TITLE}} — Atlas Core Console</title>
  <style>
    body { font: 13px/1.45 Arial, Helvetica, sans-serif; margin: 0; background: #d6dae0; color: #131820; }
    iframe.chrome { display: block; width: 100%; height: 82px; border: 0; border-bottom: 2px solid #7b8794; }
    .panel { padding: 14px 18px; }
    h1 { font-size: 15px; margin: 0 0 10px; }
    .banner { background: #fdf4d6; border: 1px solid #c8a52a; padding: 8px 10px; margin: 0 0 12px; }
    a { color: #1d4ed8; }
  </style>
</head>
<body>
<iframe class="chrome" src="/header" title="Console header"></iframe>
<div class="panel">
  <h1>Member Inquiry</h1>
  <!-- The one sentence that a business outcome is detected on. Shipped signatures
       anchor to these exact messages, so this text is load-bearing. -->
  <div class="banner" role="alert">
    <p>{{MESSAGE}}</p>
  </div>
  <p><a href="/">Return to inquiry</a></p>
</div>
</body>
</html>

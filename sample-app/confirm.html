<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Confirm Sub-Account — Atlas Core Console</title>
  <style>
    body { font: 13px/1.45 Arial, Helvetica, sans-serif; margin: 0; background: #d6dae0; color: #131820; }
    iframe.chrome { display: block; width: 100%; height: 82px; border: 0; border-bottom: 2px solid #7b8794; }
    .panel { padding: 14px 18px; }
    h1 { font-size: 15px; margin: 0 0 10px; }
    table.grid { border-collapse: collapse; background: #fff; }
    table.grid td { border: 1px solid #b6bfc9; padding: 3px 12px; }
    table.grid tr.head td { background: #eef1f5; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; }
    button { font: inherit; padding: 3px 14px; }
    .note { color: #4c5866; }
    .modal { position: fixed; inset: 0; background: rgba(19, 24, 32, .45); }
    .modal-body { background: #fff; border: 2px solid #1f2a37; width: 420px; margin: 120px auto; padding: 14px 16px; }
    .btn { display: inline-block; border: 1px solid #7b8794; background: #eef1f5; padding: 2px 16px; text-decoration: none; color: #131820; }
  </style>
</head>
<body>
<iframe class="chrome" src="/header" title="Console header"></iframe>
<div class="panel">
  <h1>Confirm Sub-Account Activation</h1>
  <p class="note">Member {{MEMBER_ID}} — review the request before it posts.</p>
  <table class="grid">
    <tr class="head"><td>Field</td><td>Value</td></tr>
<!--{{SUMMARY}}-->
  </table>
  <form method="post" action="/member/{{MEMBER_ID}}/subaccount/confirm">
<!--{{HIDDEN}}-->
    <p><button type="submit">Confirm activation</button></p>
  </form>
</div>
<!--{{DIALOG}}-->
</body>
</html>

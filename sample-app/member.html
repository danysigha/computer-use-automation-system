<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Member Summary — Atlas Core Console</title>
  <style>
    body { font: 13px/1.45 Arial, Helvetica, sans-serif; margin: 0; background: #d6dae0; color: #131820; }
    iframe.chrome { display: block; width: 100%; height: 82px; border: 0; border-bottom: 2px solid #7b8794; }
    .panel { padding: 14px 18px; }
    h1 { font-size: 15px; margin: 0 0 10px; }
    h2 { font-size: 13px; margin: 16px 0 6px; }
    table.ident { border-collapse: collapse; background: #fff; border: 1px solid #93a0b0; }
    table.ident td { border: 1px solid #c3cad3; padding: 3px 12px; }
    .field-label { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: #4c5866; }
    iframe.grid-frame { width: 640px; height: 132px; border: 1px solid #93a0b0; background: #eef1f5; }
    .form-table { border-collapse: collapse; }
    input[type=text] { font: inherit; padding: 3px 4px; border: 1px solid #7b8794; background: #fff; }
    button { font: inherit; padding: 3px 12px; }
    a { color: #1d4ed8; }
    .note { color: #4c5866; }
  </style>
</head>
<body>
<iframe class="chrome" src="/header" title="Console header"></iframe>
<div class="panel">
  <h1>Member Summary</h1>
  <table class="ident">
    <tr><td class="field-label">Member</td><td>{{MEMBER_ID}}</td></tr>
    <tr><td class="field-label">Name</td><td>{{MEMBER_NAME}}</td></tr>
    <tr><td class="field-label">Branch</td><td>04 — Riverside</td></tr>
  </table>

  <h2>Account Balances</h2>
  <!-- The balance grid is a separate document, exactly like the frameset-era core
       grids this fixture is modeled on. -->
  <iframe class="grid-frame" src="{{GRID_URL}}" title="Account balances"></iframe>

  <h2>Account Actions</h2>
  <p><a href="/member/{{MEMBER_ID}}/subaccount">New sub-account</a></p>
  <p><a href="/member/{{MEMBER_ID}}/close-account">Close account</a></p>

  <h2>Taxpayer Certification</h2>
  <p class="note">Required once per tax year. Not part of routine account servicing.</p>
  <form method="get" action="/member/{{MEMBER_ID}}/summary">
    <table class="form-table">
      <tr><td class="field-label">Taxpayer SSN</td></tr>
      <tr><td><input type="text" name="taxpayerSsn" aria-label="Taxpayer SSN" size="14" autocomplete="off"></td></tr>
      <tr><td class="field-label">&nbsp;</td></tr>
      <tr><td><button type="submit">File certification</button></td></tr>
    </table>
  </form>
</div>
</body>
</html>

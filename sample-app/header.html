<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Atlas Core Console — Header</title>
  <style>
    body { font: 12px/1.4 Arial, Helvetica, sans-serif; margin: 0; padding: 10px 14px; background: #1f2a37; color: #e6ebf2; }
    .brand { font-size: 14px; font-weight: bold; letter-spacing: .07em; }
    ul { margin: 8px 0 0; padding: 0; list-style: none; }
    li { display: inline-block; margin-right: 18px; }
    a { color: #cfe0f2; text-decoration: none; }
  </style>
</head>
<body>
  <div class="brand">ATLAS CORE CONSOLE</div>
  <!-- Console chrome, deliberately noisy: these labels repeat words that appear in
       real state messages, and `Search` here is a link while the real control on the
       home page is a button — targeting has to be specific, not approximate. -->
  <ul>
    <li><a href="/">Inquiry</a></li>
    <li><a href="/">Search</a></li>
    <li><a href="/">Locked Accounts Report</a></li>
    <li><a href="/">End of Day</a></li>
  </ul>
</body>
</html>
